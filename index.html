<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Memory Matcher</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: #1e1e2e;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 24px;
  }
  h1 { margin: 0; font-size: 1.6rem; }
  #status { min-height: 1.4em; opacity: 0.85; }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, 90px);
    gap: 10px;
  }
  .cell {
    width: 90px;
    height: 90px;
    border-radius: 10px;
    background: #6b6b7a;
    border: 4px solid transparent;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
  }
  .cell:hover:not(:disabled) { transform: scale(1.05); }
  .cell:disabled { cursor: default; }
  .cell.selected { border-color: #ffffff; }
  .cell.correct  { border-color: #22c55e; }
  .cell.wrong    { border-color: #ef4444; }
  .cell.missed   { border-color: #eab308; }
  #newGame {
    padding: 10px 20px;
    font-size: 1rem;
    border: none;
    border-radius: 8px;
    background: #8b5cf6;
    color: white;
    cursor: pointer;
  }
  #newGame:hover { background: #7c3aed; }
</style>
</head>
<body>
<h1>Color Memory Matcher</h1>
<div id="status"></div>
<div id="grid"></div>
<button id="newGame">New Game</button>

<script>
const SIZE = 4;
const TOTAL = SIZE * SIZE;
const PATTERN_COUNT = 4;
const SHOW_MS = 2000;
const GUESS_LIMIT = 4;
const PALETTE = ['#ef4444', '#3b82f6', '#22c55e', '#eab308',
                 '#a855f7', '#ec4899', '#14b8a6', '#f97316'];

const PHASE = { SHOWING: 'showing', GUESSING: 'guessing', REVEALED: 'revealed' };

const gridEl = document.getElementById('grid');
const statusEl = document.getElementById('status');
const newGameBtn = document.getElementById('newGame');

let state = null;
let showTimer = null;

function randomInt(n) {
  return Math.floor(Math.random() * n);
}

// Returns Map<index, color> with PATTERN_COUNT unique positions.
function pickPattern() {
  const indices = Array.from({ length: TOTAL }, (_, i) => i);
  // Partial Fisher-Yates: first PATTERN_COUNT entries are unique random positions.
  for (let i = 0; i < PATTERN_COUNT; i++) {
    const j = i + randomInt(TOTAL - i);
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  const pattern = new Map();
  for (let i = 0; i < PATTERN_COUNT; i++) {
    pattern.set(indices[i], PALETTE[randomInt(PALETTE.length)]);
  }
  return pattern;
}

function newGame() {
  clearTimeout(showTimer);
  state = {
    pattern: pickPattern(),
    selections: [],           // ordered, unique, length <= GUESS_LIMIT
    phase: PHASE.SHOWING,
  };
  render();

  showTimer = setTimeout(() => {
    state.phase = PHASE.GUESSING;
    render();
  }, SHOW_MS);
}

function guess(index) {
  if (state.phase !== PHASE.GUESSING) return;
  if (state.selections.includes(index)) return;

  state.selections.push(index);
  if (state.selections.length === GUESS_LIMIT) {
    state.phase = PHASE.REVEALED;
  }
  render();
}

// Compares guessed positions against pattern positions.
function evaluate() {
  const guessed = new Set(state.selections);
  const actual = new Set(state.pattern.keys());
  const correct = new Set([...guessed].filter(i => actual.has(i)));
  const wrong   = new Set([...guessed].filter(i => !actual.has(i)));
  const missed  = new Set([...actual].filter(i => !guessed.has(i)));
  return { correct, wrong, missed, score: correct.size };
}

function statusText(result) {
  switch (state.phase) {
    case PHASE.SHOWING:
      return 'Memorize the colored squares...';
    case PHASE.GUESSING:
      return `Pick ${GUESS_LIMIT - state.selections.length} more square(s).`;
    case PHASE.REVEALED:
      return `You got ${result.score} of ${PATTERN_COUNT} correct.`;
  }
}

function render() {
  const revealed = state.phase === PHASE.REVEALED;
  const showingColors = state.phase === PHASE.SHOWING;
  const result = revealed ? evaluate() : null;

  gridEl.innerHTML = '';
  for (let i = 0; i < TOTAL; i++) {
    const cell = document.createElement('button');
    cell.className = 'cell';

    // Colors are visible only during the flash and the reveal.
    if ((showingColors || revealed) && state.pattern.has(i)) {
      cell.style.background = state.pattern.get(i);
    }

    if (revealed) {
      if (result.correct.has(i)) cell.classList.add('correct');
      else if (result.wrong.has(i)) cell.classList.add('wrong');
      else if (result.missed.has(i)) cell.classList.add('missed');
    } else if (state.selections.includes(i)) {
      cell.classList.add('selected');
    }

    cell.disabled = state.phase !== PHASE.GUESSING;
    cell.addEventListener('click', () => guess(i));
    gridEl.appendChild(cell);
  }

  statusEl.textContent = statusText(result);
}

newGameBtn.addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
